[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[profile.gas]
# used for the pitch-slide verification-gas numbers
optimizer = true
optimizer_runs = 1000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
